<script type="module">
/* ═══ STICKY ROLLER · a Multiplayer Agent starter ═════════════════════════════════════
 * Roll a sticky ball around a toy town. Anything smaller than you sticks on and you grow:
 * crumbs, then toys, chairs, cars and houses. Roll up smaller players too. The biggest
 * ball when time runs out wins. Party, 2–8 players; bots fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ sizes, speeds, timers, bots, and `things`: every kind of thing in the
 *                   town (how big, how many, how far from the middle)
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   TOWN .......... lays the things out from the round's seed (the same on every screen)
 *   LOOKS ......... what each kind of thing looks like, built from boxes, balls and cones
 *   SCENE ......... sky, grass, the picnic blanket, the ring road, the fence, lights
 *   BALLS ......... rolling (one function for you and the bots), bumping, the ball model
 *   ROUND (HOST) .. the round, who owns which thing, roll-ups, bots. Only the host writes these.
 *   ME ............ steering, rolling things up, respawning. Each player writes only its own.
 *   THINGS ON SCREEN  where each thing is drawn: on the ground or stuck on a ball
 *   EFFECTS ....... confetti, sounds
 *   HUD & RESULTS . size, timer, top 5, countdown, results, leaderboard
 *   INPUT ......... keyboard, and a touch stick plus a Dash button
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player rolls its OWN ball and writes it to its entity as `m` (one packed JSON
 *     field: round id, position, velocity) about 12 times a second, plus `hb` (heartbeat)
 *     once a second and `n`/`c` (name, color) once.
 *   - The town comes from the round's seed, so every screen builds the same things with the
 *     same ids. The HOST decides who owns each one: shared `taken` is one string with a
 *     character per thing ("." = on the ground, a letter = stuck on that ball).
 *   - Intent "grab" {ids}: you touched things you can roll up. Your screen sticks them on
 *     at once; the host gives each one to the FIRST ball that asked and grows that ball.
 *     If someone beat you to it, it jumps over to their ball on your screen.
 *   - The host also decides roll-ups: a ball under 3/4 of another's size that ends up
 *     inside it bursts, loses part of its size (its biggest things go to the bigger ball)
 *     and respawns somewhere else.
 *   - Shared `balls` (host only): version `v`, every ball's letter, size, burst count and
 *     respawn spot, plus the bots' positions. Sizes are decided by the host, so you read
 *     yours here. Shared `round` (host only): id, version `v`, phase, seed, timers, results.
 *     The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. A new host adopts all three fields and carries on.
 *   - A tab that was frozen or hidden for over 1s, or lost its connection, forgets it was host,
 *     waits 0.7s for the newer state to arrive, then adopts it; nobody writes a `v` lower than
 *     the shared one, and nobody hosts while disconnected.
 *   - Event "pop" {v, by, x, z, r, c}: a burst, for the effect only.
 *   - Intent "again" {} from the results card asks the host to start the next round now.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "biggest-ball": each player's biggest ball at the end of a round, in cm.
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {

  growth: 0.4,            // a thing of size s adds growth × s² to your radius²

    { type: "candy",     size: [0.14, 0.2],  count: 60, ring: [0, 20], tints: ["#ff7eb6", "#7ee0ff", "#b6ff7e", "#d59bff", "#ffd27e"] },

    { type: "block",     size: [0.34, 0.48], count: 55, ring: [5, 55], tints: ["#ff5a5a", "#4da6ff", "#ffd23f", "#52d273", "#ff8c42"] },
    { type: "duck",      size: [0.42, 0.58], count: 40, ring: [8, 60], tints: ["#ffd84d", "#ffe680", "#ff9ccf"] },
    { type: "mug",       size: [0.48, 0.62], count: 25, ring: [6, 40], tints: ["#ffffff", "#ffd0d0", "#d0e8ff"] },
    { type: "toycar",    size: [0.55, 0.78], count: 40, ring: [10, 66], tints: ["#ff4d4d", "#4da6ff", "#ffd23f", "#52d273"] },
    { type: "book",      size: [0.8, 1.05],  count: 38, ring: [15, 70], tints: ["#ff6b6b", "#5fa8ff", "#6bd88a", "#c38bff", "#ffb04d"], unlock: "books and teddies" },
    { type: "teddy",     size: [0.95, 1.3],  count: 28, ring: [18, 75], tints: ["#ffffff", "#ffe2c4", "#ffd6e6"] },
    { type: "beachball", size: [0.9, 1.25],  count: 24, ring: [20, 80] },
    { type: "cone",      size: [1.15, 1.5],  count: 28, ring: [28, 88] },
    { type: "chair",     size: [1.45, 1.95], count: 32, ring: [30, 88], tints: ["#d9985a", "#ff8c42", "#5fa8ff", "#6bd88a"], unlock: "chairs" },
    { type: "bike",      size: [1.8, 2.4],   count: 16, ring: [40, 90], tints: ["#ff4d4d", "#4da6ff", "#52d273", "#c77dff"], unlock: "bikes" },
    { type: "mailbox",   size: [1.7, 2.2],   count: 14, ring: [55, 108], tints: ["#4d7dff", "#ff5a5a", "#52d273"] },
    { type: "bench",     size: [2.4, 3],     count: 16, ring: [50, 108] },
    { type: "car",       size: [3, 4],       count: 18, ring: [93, 103], face: "road", tints: ["#ff4d4d", "#4da6ff", "#ffd23f", "#52d273", "#ffffff", "#c77dff"], unlock: "cars" },
    { type: "tree",      size: [3.4, 5],     count: 24, ring: [60, 150], tints: ["#ffffff", "#e6ffd0", "#fff0b0"], unlock: "trees" },
    { type: "van",       size: [4.2, 5.2],   count: 8,  ring: [93, 103], face: "road", tints: ["#ffffff", "#ffe08a", "#9fd0ff"] },
    { type: "house",     size: [7, 9.5],     count: 14, ring: [118, 160], face: "middle", tints: ["#ffffff", "#ffe6d0", "#e0f0ff", "#fff3b0", "#e6ffe0"], unlock: "houses" },
    { type: "tower",     size: [10, 12],     count: 5,  ring: [135, 165], face: "middle", tints: ["#ffffff", "#ffe6d0", "#e0f0ff"], unlock: "towers" },
  ],
};
const BOT_NAMES = ["Mochi", "Pudding", "Gumball", "Noodle", "Pickles", "Waffles", "Sprout", "Biscuit"];
const COLORS = ["#ff4d6d", "#4dabff", "#ffd23f", "#52d273", "#c77dff", "#ff8c42", "#3de0d0", "#ff6fb5"];
const SLOTS = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"; // one letter per ball in `taken`

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'sticky-roller',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");
const TEST = new URLSearchParams(location.search).has("test");
if (ATTRACT) Object.assign(CONFIG, { seats: 7, countdown: 400, graceMs: 0, roundMs: 90000, attractStart: 1.2, botStart: [0.5, 1.4] });
if (TEST && new URLSearchParams(location.search).get("cfg")) Object.assign(CONFIG, JSON.parse(new URLSearchParams(location.search).get("cfg"))); // tests only: try other numbers

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;

    console.warn("Playing offline:", e && e.message);

const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A shared JSON field, parsed once per change (read-only: never change what this returns). */
function shared(key, fb) {
  const raw = S.shared[key], m = memo.get(key);
  if (m && m.raw === raw) return m.v;
  const v = parse(raw, fb); memo.set(key, { raw, v }); return v;
}
let net = null, S = { entities: { players: {} }, shared: {} }, dropped = false;
const seenHb = new Map();
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
const isHost = () => livePlayers()[0] === net.sessionId;

// ── TOWN ────────────────────────────────────────────────────────────────────────────
// A round's seed lays out every thing; the ids are the order they're made in.
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
const N_THINGS = CONFIG.things.reduce((n, d) => n + d.count, 0); // `taken` has one character per thing
let town = [];
/** Every thing for one round: { i, d (kind), k (its number among its kind), s (size), x, z, y, fp, homeQ, tint, seedDir, rot }. */
function makeTown(seed) {
  const rand = mulberry32(seed), out = [];
  CONFIG.things.forEach((def, d) => {
    const L = LOOK[d];
    for (let k = 0; k < def.count; k++) {
      const s = lerp(def.size[0], def.size[1], rand());
      let x = 0, z = 0, a = 0;
      for (let tries = 0; tries < 20; tries++) { // somewhere in its ring, not on top of anything, off the road unless it parks there
        a = rand() * Math.PI * 2;
        const dist = Math.sqrt(lerp(def.ring[0] ** 2, def.ring[1] ** 2, rand()));
        x = Math.cos(a) * dist; z = Math.sin(a) * dist;
        if (def.face !== "road" && Math.abs(dist - CONFIG.road) < 7 + s * L.fp) continue;
        if (out.every((o) => (o.x - x) ** 2 + (o.z - z) ** 2 > ((o.s * o.fp + s * L.fp) * 0.9) ** 2)) break;
      }
      const yaw = def.face === "road" ? -a - Math.PI / 2 + (rand() < 0.5 ? Math.PI : 0) : def.face === "middle" ? Math.atan2(-Math.cos(a), -Math.sin(a)) : rand() * Math.PI * 2;
      const tints = def.tints || ["#ffffff"], tint = tints[Math.floor(rand() * tints.length)];
      const seedDir = new THREE.Vector3(rand() - 0.5, rand() - 0.5, rand() - 0.5).normalize(); // where it sits on a ball when we didn't see it stick
      const rot = new THREE.Quaternion().setFromEuler(new THREE.Euler(rand() * 6.3, rand() * 6.3, rand() * 6.3));

}
const UP = new THREE.Vector3(0, 1, 0);

// ── LOOKS ───────────────────────────────────────────────────────────────────────────
// Each kind of thing is a few simple parts merged into one mesh with vertex colors. White
// parts take the thing's tint; dark parts stay dark. Models face +x (cars) or +z (houses).
const SH = {
  box: new THREE.BoxGeometry(1, 1, 1), ball: new THREE.SphereGeometry(1, 12, 9), cyl: new THREE.CylinderGeometry(1, 1, 1, 12),
  cone: new THREE.ConeGeometry(1, 1, 12), roof: new THREE.ConeGeometry(1, 1, 4).rotateY(Math.PI / 4), rock: new THREE.DodecahedronGeometry(1, 0),

const H = Math.PI / 2;
/** One part: a shape, a color (or a function of the point), where, how big, how turned. */
const part = (shape, color, at = [0, 0, 0], size = [1, 1, 1], rot = [0, 0, 0]) => ({ shape, color, at, size, rot });
const wheels = (xs, y, zs, r, w) => xs.flatMap((x) => zs.map((z) => part(SH.cyl, "#262626", [x, y, z], [r, w, r], [H, 0, 0])));
const LOOKS = {
  crumb: () => [part(SH.rock, "#d9a55b", [0, 0, 0], [1, 0.55, 0.8])],
  coin: () => [part(SH.cyl, "#e8a923", [0, 0, 0], [1, 0.16, 1]), part(SH.cyl, "#ffd95a", [0, 0.012, 0], [0.78, 0.16, 0.78])],
  candy: () => [part(SH.ball, "#ffffff", [0, 0, 0], [0.6, 0.55, 0.55]), part(SH.cone, "#ffffff", [0.85, 0, 0], [0.38, 0.5, 0.38], [0, 0, H]), part(SH.cone, "#ffffff", [-0.85, 0, 0], [0.38, 0.5, 0.38], [0, 0, -H])],
  cookie: () => [part(SH.cyl, "#c98a4b", [0, 0, 0], [1, 0.26, 1]), ...[[0.4, 0.2], [-0.35, 0.35], [-0.1, -0.45], [0.45, -0.35], [-0.5, -0.1], [0.05, 0.05]].map(([x, z]) => part(SH.ball, "#4a2a14", [x, 0.13, z], [0.14, 0.08, 0.14]))],
  die: () => {
    const pip = (at, rot) => part(SH.cyl, "#262626", at, [0.09, 0.04, 0.09], rot);
    return [part(SH.box, "#ffffff"), ...[[0, 0], [-0.25, -0.25], [0.25, 0.25], [-0.25, 0.25], [0.25, -0.25]].map(([a, b]) => pip([a, 0.5, b])),

    list.innerHTML = entries.length ? entries.map((x) => `<li>${esc(x.username || "Player")}<span>${fmtSize(x.score / 20)}</span></li>`).join("") : "<li class=\"note\">No balls yet. Roll the first.</li>";
  }).catch(() => { list.innerHTML = "<li class=\"note\">Couldn't load the leaderboard.</li>"; });
}
$("again").onclick = () => { if (hosting()) again(); else net.send("again", {}); };

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
$("stick").hidden = $("dashBtn").hidden = !touchUI;
document.body.classList.toggle("touch", touchUI);
const KEYS = { ArrowUp: "up", w: "up", W: "up", ArrowDown: "down", s: "down", S: "down", ArrowLeft: "left", a: "left", A: "left", ArrowRight: "right", d: "right", D: "right" };
const wakeAudio = () => { if (!actx && !ATTRACT) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } };
addEventListener("keydown", (e) => { wakeAudio(); const k = KEYS[e.key]; if (k) { e.preventDefault(); input[k] = true; } if (e.key === " ") { e.preventDefault(); if (!e.repeat) input.dash = true; } });
addEventListener("keyup", (e) => { const k = KEYS[e.key]; if (k) input[k] = false; });
addEventListener("blur", () => { input.up = input.down = input.left = input.right = false; });
const stick = $("stick"), knob = $("knob");
let stickId = null;
function moveStick(e) {
  const r = stick.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let dx = (e.clientX - cx) / 50, dy = (e.clientY - cy) / 50; const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; }
  input.sx = dx; input.sy = dy; knob.style.transform = `translate(${dx * 40}px, ${dy * 40}px)`;
}
stick.addEventListener("pointerdown", (e) => { e.preventDefault(); wakeAudio(); stickId = e.pointerId; stick.setPointerCapture(e.pointerId); moveStick(e); });
stick.addEventListener("pointermove", (e) => { if (e.pointerId === stickId) moveStick(e); });
for (const ev of ["pointerup", "pointercancel"]) stick.addEventListener(ev, (e) => { if (e.pointerId !== stickId) return; stickId = null; input.sx = input.sy = 0; knob.style.transform = ""; });
const dashBtn = $("dashBtn");
dashBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); wakeAudio(); input.dash = true; dashBtn.classList.add("on"); });
for (const ev of ["pointerup", "pointercancel", "pointerleave"]) dashBtn.addEventListener(ev, () => dashBtn.classList.remove("on"));
cv.addEventListener("pointerdown", wakeAudio);
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastAwake = performance.now(), lastHb = 0, lastHud = 0, camYaw = 0, camSnap = true;
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame); // first, so one error can't stop the game
  const awake = performance.now(); // not `now`: after a long freeze the first frame can be stamped from before it ended
  if (awake - lastAwake > 1000) { host.wasHost = false; host.last = null; host.waitUntil = awake + 700; } // this tab was frozen or hidden: forget being host, let the newer state arrive, then adopt it
  lastAwake = awake;
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  let r = round();
  if (r && r.id !== shownRound) resetRound(r);
  if (isHost() && !dropped && awake >= host.waitUntil) hostTick(dt, now); else host.wasHost = false;
  r = round();
  if (r && r.id !== shownRound) resetRound(r);
  if (r) myTick(dt, r, now);
  drawBalls(dt, now, r);
  drawThings(now);
  tickConfetti(dt);
  updateCamera(dt, now);
  renderer.render(scene, camera);
  if (r && now - lastHud > 100) { lastHud = now; hud(r, now); dashBtn.classList.toggle("wait", now < me.dashReady); }
}
function updateCamera(dt, now) {
  const on = me.view && me.view.g.visible, R = on ? me.view.r : 1.5, c = on ? me.view.p : _p.set(0, 0, 0);
  camYaw += wrap(me.yaw - camYaw) * Math.min(1, dt * 6);
  const back = ATTRACT ? 1.6 + R * 5.2 : 1.3 + R * 5.6, high = ATTRACT ? 1.2 + R * 4.2 : 0.7 + R * 3.2; // the camera pulls back as you grow
  camPos.set(c.x - Math.sin(camYaw) * back, high, c.z - Math.cos(camYaw) * back);
  const taken = takenNow();
  for (const t of town) if ((taken[t.i] || ".") === "." && t.s > R * 0.5 && Math.hypot(t.x - camPos.x, t.z - camPos.z) < t.s * t.fp + 1) camPos.y = Math.max(camPos.y, t.y * 2 + 1); // don't sit inside a house
  if (camSnap) { camera.position.copy(camPos); camSnap = false; } else camera.position.lerp(camPos, 1 - Math.pow(0.002, dt));
  me.shake = Math.max(0, me.shake - dt * 2.5);
  const sh = me.shake * R * 0.3;
  camLook.set(c.x + Math.sin(camYaw) * R * 2 + (Math.random() - 0.5) * sh, R * 0.6 + (Math.random() - 0.5) * sh, c.z + Math.cos(camYaw) * R * 2);
  camera.lookAt(camLook);
  camera.near = Math.max(0.03, R * 0.06); camera.updateProjectionMatrix();
  scene.fog.near = back * 3 + 10; scene.fog.far = back * 3 + 170 + R * 45;
  sun.position.set(c.x + 30 + R * 20, 60 + R * 40, c.z + 20 + R * 14); sun.target.position.set(c.x, 0, c.z);
  const ext = 10 + R * 12; Object.assign(sun.shadow.camera, { left: -ext, right: ext, top: ext, bottom: -ext, near: 1, far: 220 + R * 150 }); sun.shadow.camera.updateProjectionMatrix();
  sky.position.copy(camera.position);
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("grab", (msg, from) => { if (isHost() && msg && Array.isArray(msg.ids)) applyGrab(from, msg.ids.slice(0, 60)); });
  net.on("again", () => again());
  net.on("pop", (msg) => { if (msg && typeof msg.x === "number") popFx(msg); });
  net.onDisconnect(() => { dropped = true; host.wasHost = false; $("net").textContent = "Reconnecting…"; }); // our sends wait for the reconnect, so don't host meanwhile
  net.onReconnect(() => { dropped = false; host.wasHost = false; host.last = null; host.waitUntil = performance.now() + 700; }); // the full state comes back: adopt it, never our old copy
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...ballList().filter((e) => e.b).map((e) => e.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  started = performance.now();
  if (TEST) window.__test = { // ?test only: lets the test scripts look inside
    me: () => { const e = myEntry(); return { id: net.sessionId, x: me.ball.x, z: me.ball.z, r: e && e.r, R: e && myR(e), slot: e && e.s, k: e && e.k, host: isHost(), pending: me.pending.size }; },
    round: () => round(), balls: () => ballList(), taken: () => takenNow().join(""), shown: () => town.map((t) => t.shown || ".").join(""),
    things: () => town.map((t) => ({ i: t.i, type: CONFIG.things[t.d].type, s: +t.s.toFixed(3), x: +t.x.toFixed(2), z: +t.z.toFixed(2) })),
    teleport: (x, z) => { me.ball.x = x; me.ball.z = z; me.ball.vx = me.ball.vz = 0; },
    setSize: (id, r) => { const e = host.balls.get(id); if (hosting() && e) { e.r = r; host.dirty = true; return true; } return false; },
  };
  requestAnimationFrame(frame);
})();
</script>
